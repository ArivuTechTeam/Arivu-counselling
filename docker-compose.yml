services:
  backend:
    build:
      context: ./backend
    container_name: quiz-generator-backend
    ports:
      # host:container — container keeps the app's normal port (8000);
      # only the host side is moved to 8001 to avoid arivupro_examapp's 8000.
      - "8001:8000"
    environment: &backend-environment
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
      WATCHFILES_FORCE_POLLING: "true"
      APP_ENV: development
      APP_DEBUG: "false"
      FACULTY_JOBS_ENABLED: ${FACULTY_JOBS_ENABLED:-false}
      EVALUATION_JOBS_ENABLED: ${EVALUATION_JOBS_ENABLED:-false}
      HANDWRITTEN_RUBRIC_PROVIDER: ${HANDWRITTEN_RUBRIC_PROVIDER:-gemini}
      EVALUATION_WORKER_POLL_SECONDS: ${EVALUATION_WORKER_POLL_SECONDS:-3}
      EVALUATION_JOB_SOFT_TIMEOUT_SECONDS: ${EVALUATION_JOB_SOFT_TIMEOUT_SECONDS:-780}
      EVALUATION_JOB_HARD_TIMEOUT_SECONDS: ${EVALUATION_JOB_HARD_TIMEOUT_SECONDS:-840}
      EVALUATION_REAPER_INTERVAL_SECONDS: ${EVALUATION_REAPER_INTERVAL_SECONDS:-60}
      HANDWRITTEN_EVALUATION_ATTEMPTS_PER_PAPER: ${HANDWRITTEN_EVALUATION_ATTEMPTS_PER_PAPER:-2}
      PER_QUESTION_STAGE2_ENABLED: ${PER_QUESTION_STAGE2_ENABLED:-true}
      PER_QUESTION_STAGE2_CONCURRENCY: ${PER_QUESTION_STAGE2_CONCURRENCY:-5}
      DEEPSEEK_PER_QUESTION_MAX_TOKENS: ${DEEPSEEK_PER_QUESTION_MAX_TOKENS:-32000}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-80000}
      DEEPSEEK_THINKING_EFFORT: ${DEEPSEEK_THINKING_EFFORT:-high}
      DEEPSEEK_MAX_CONCURRENCY: ${DEEPSEEK_MAX_CONCURRENCY:-24}
      DEEPSEEK_SLOT_WAIT_SECONDS: ${DEEPSEEK_SLOT_WAIT_SECONDS:-30}
      RATE_LIMIT_HANDWRITTEN_EVALUATION_PER_HOUR: ${RATE_LIMIT_HANDWRITTEN_EVALUATION_PER_HOUR:-10}
      GEMINI_STAGE1_MAX_OUTPUT_TOKENS: ${GEMINI_STAGE1_MAX_OUTPUT_TOKENS:-32000}
      GEMINI_STAGE1_THINKING_BUDGET: ${GEMINI_STAGE1_THINKING_BUDGET:-4000}
      QUIZ_REUSE_ENABLED: ${QUIZ_REUSE_ENABLED:-false}
      BATCHES_ENABLED: ${BATCHES_ENABLED:-false}
      SCORING_POLICIES_ENABLED: ${SCORING_POLICIES_ENABLED:-false}
      COMMERCE_PACK_ENABLED: ${COMMERCE_PACK_ENABLED:-false}
      FIGURE_ATTACH_ENABLED: ${FIGURE_ATTACH_ENABLED:-false}
      FIGURE_MAX_PER_DOCUMENT: ${FIGURE_MAX_PER_DOCUMENT:-50}
      FACULTY_WORKER_STALE_SECONDS: ${FACULTY_WORKER_STALE_SECONDS:-120}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      HANDOFF_SHARED_SECRET: ${HANDOFF_SHARED_SECRET}
      EXAMAPP_FRONTEND_URL: ${EXAMAPP_FRONTEND_URL}
      SUPABASE_READ_TIMEOUT_SECONDS: ${SUPABASE_READ_TIMEOUT_SECONDS:-5}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3001}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-false}
      DEEPSEEK_STRUCTURED_MAX_OUTPUT_TOKENS: ${DEEPSEEK_STRUCTURED_MAX_OUTPUT_TOKENS:-16384}
      DEEPSEEK_REQUEST_TIMEOUT_SECONDS: ${DEEPSEEK_REQUEST_TIMEOUT_SECONDS:-240}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-65536}
      USD_TO_INR_RATE: ${USD_TO_INR_RATE:-83.0}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_STAGE1_MODEL: ${GEMINI_STAGE1_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash}
      GEMINI_BLUEPRINT_MODEL: ${GEMINI_BLUEPRINT_MODEL:-gemini-3.5-flash-lite}
      GEMINI_VISION_TIMEOUT_SECONDS: ${GEMINI_VISION_TIMEOUT_SECONDS:-240}
      GEMINI_EXTRACTION_MAX_OUTPUT_TOKENS: ${GEMINI_EXTRACTION_MAX_OUTPUT_TOKENS:-65536}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-gemini}
      TOPIC_ANALYSIS_PROVIDER: ${TOPIC_ANALYSIS_PROVIDER:-deepseek}
      QUIZ_GENERATION_PROVIDER: ${QUIZ_GENERATION_PROVIDER:-deepseek}
      TYPED_QUIZ_EXTRACTION_PROVIDER: ${TYPED_QUIZ_EXTRACTION_PROVIDER:-deepseek}
      QUESTION_VERIFICATION_PROVIDER: ${QUESTION_VERIFICATION_PROVIDER:-deepseek}
      QUESTION_REGENERATION_PROVIDER: ${QUESTION_REGENERATION_PROVIDER:-deepseek}
      VISION_EXTRACTION_PROVIDER: ${VISION_EXTRACTION_PROVIDER:-gemini}
      EXTRACTION_TEXT_CHUNK_CHARS: ${EXTRACTION_TEXT_CHUNK_CHARS:-18000}
      EXTRACTION_CHUNK_CONCURRENCY: ${EXTRACTION_CHUNK_CONCURRENCY:-4}
      GENERATION_MAX_TEXT_CHARS: ${GENERATION_MAX_TEXT_CHARS:-100000}
      CHUNKING_TRIGGER_CHARS: ${CHUNKING_TRIGGER_CHARS:-100000}
      GENERATION_CHUNK_CHARS: ${GENERATION_CHUNK_CHARS:-60000}
      GENERATION_CHUNK_OVERLAP_CHARS: ${GENERATION_CHUNK_OVERLAP_CHARS:-5000}
      GENERATION_CHUNK_MIN_CHARS: ${GENERATION_CHUNK_MIN_CHARS:-8000}
      GENERATION_CHUNK_CONCURRENCY: ${GENERATION_CHUNK_CONCURRENCY:-4}
      GENERATION_MAP_MAX_OUTPUT_TOKENS: ${GENERATION_MAP_MAX_OUTPUT_TOKENS:-65536}
      GENERATION_PROFILE_MAX_CHARS: ${GENERATION_PROFILE_MAX_CHARS:-200000}
      # Large documents consume one profile call, one call per chunk, and one
      # or two consolidation attempts. Pass these explicitly so editing .env
      # actually changes the recreated backend container.
      RATE_LIMIT_TOPIC_EXTRACTION_PER_HOUR: ${RATE_LIMIT_TOPIC_EXTRACTION_PER_HOUR:-30}
      RATE_LIMIT_QUIZ_GENERATION_PER_HOUR: ${RATE_LIMIT_QUIZ_GENERATION_PER_HOUR:-10}
      RATE_LIMIT_BLUEPRINT_PER_HOUR: ${RATE_LIMIT_BLUEPRINT_PER_HOUR:-10}
      RATE_LIMIT_QUESTION_REGENERATE_PER_HOUR: ${RATE_LIMIT_QUESTION_REGENERATE_PER_HOUR:-10}
      RATE_LIMIT_QUESTION_EXPLAIN_PER_HOUR: ${RATE_LIMIT_QUESTION_EXPLAIN_PER_HOUR:-10}
      RATE_LIMIT_QUIZ_EXTRACTION_PER_HOUR: ${RATE_LIMIT_QUIZ_EXTRACTION_PER_HOUR:-10}
      RATE_LIMIT_CHALLENGE_JOIN_PER_HOUR: ${RATE_LIMIT_CHALLENGE_JOIN_PER_HOUR:-30}
      RATE_LIMIT_PAPER_GENERATION_PER_HOUR: ${RATE_LIMIT_PAPER_GENERATION_PER_HOUR:-10}
      GENERATION_LARGE_REQUEST_TIMEOUT_SECONDS: ${GENERATION_LARGE_REQUEST_TIMEOUT_SECONDS:-600}
      GENERATION_CHUNK_STUCK_SECONDS: ${GENERATION_CHUNK_STUCK_SECONDS:-900}
      STUDENT_QUIZ_ATTEMPT_LIMIT: ${STUDENT_QUIZ_ATTEMPT_LIMIT:-2}
      DAILY_CHALLENGE_TIMEZONE: ${DAILY_CHALLENGE_TIMEZONE:-Asia/Kolkata}
      CHALLENGE_EXPIRY_DAYS: ${CHALLENGE_EXPIRY_DAYS:-30}
      FACULTY_JOBS_POLL_SECONDS: ${FACULTY_JOBS_POLL_SECONDS:-3}
    # Local Docker mounts the checkout so restarting the container never
    # serves an old COPY baked into its image. Installing requirements at
    # startup also picks up dependency changes without a separate rebuild.
    volumes:
      - ./backend:/app
      - ./migrations:/migrations:ro
    command: >-
      sh -c "pip install -q --require-hashes -r requirements.lock &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    networks:
      - quiz-generator-net

  faculty-worker:
    profiles: ["faculty-jobs"]
    build:
      context: ./backend
    environment: *backend-environment
    volumes:
      - ./backend:/app
    command: >-
      sh -c "pip install -q --require-hashes -r requirements.lock &&
      exec python -m app.services.faculty_worker"
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - quiz-generator-net

  evaluation-worker:
    profiles: ["evaluation-jobs"]
    build:
      context: ./backend
      dockerfile: Dockerfile.evaluation-worker
    environment: *backend-environment
    volumes:
      - ./backend:/app
    command: >-
      sh -c "pip install -q --require-hashes -r requirements.lock &&
      exec python -m app.services.evaluation_worker"
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - quiz-generator-net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_DEFAULT_TENANT_ID: ${NEXT_PUBLIC_DEFAULT_TENANT_ID}
        # Baked into the browser bundle, so it must be a URL the HOST
        # browser can reach — not the internal "backend" service name.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    container_name: quiz-generator-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    # `next dev` reads these on every start. Docker Desktop's stop/start
    # control therefore uses current .env values instead of an old bundle.
    environment:
      NODE_ENV: development
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_DEFAULT_TENANT_ID: ${NEXT_PUBLIC_DEFAULT_TENANT_ID}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    # Dependencies and Next's generated files stay inside Docker volumes;
    # application source comes directly from the current checkout.
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    command: >-
      sh -c "pnpm install --frozen-lockfile --prefer-offline &&
      exec pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    networks:
      - quiz-generator-net

networks:
  quiz-generator-net:
    name: quiz-generator-net
    driver: bridge

volumes:
  frontend-node-modules:
  frontend-next-cache:
