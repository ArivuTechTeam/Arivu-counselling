name: Pull request checks

on:
  pull_request:
    branches:
      - main

jobs:
  faculty-database:
    name: Faculty queue database guarantees
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install isolated Postgres test runtime
        run: npm install --prefix .tmp/pg-test --no-audit --no-fund --save-exact @electric-sql/pglite@0.3.14

      - name: Verify migrations, leases and atomic job completion
        run: node scripts/test-faculty-jobs-db.mjs

      - name: Verify quiz copying and immutable publication
        run: node scripts/test-quiz-reuse-db.mjs

      - name: Verify figure migration repair and tenant isolation
        run: node scripts/test-figure-migrations-db.mjs

      - name: Verify level-aware batches, scoring and commerce schema
        run: node scripts/test-academic-rollout-db.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-non-secret-${{ github.run_id }}-${{ github.run_attempt }}
      SUPABASE_SERVICE_ROLE_KEY: ci-non-secret-${{ github.run_id }}-${{ github.run_attempt }}
      SUPABASE_JWT_SECRET: ci-non-secret-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_ORIGIN: https://app.example.com
      GEMINI_API_KEY: ci-non-secret-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build
