name: Repository checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  faculty-database:
    name: Faculty queue database guarantees
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated Postgres test runtime
        run: npm install --prefix .tmp/pg-test --no-audit --no-fund --save-exact @electric-sql/pglite@0.3.14

      - name: Verify migrations, leases and atomic job completion
        run: node scripts/test-faculty-jobs-db.mjs

      - name: Verify quiz copying and immutable publication
        run: node scripts/test-quiz-reuse-db.mjs

      - name: Verify figure migration repair and tenant isolation
        run: node scripts/test-figure-migrations-db.mjs

      - name: Verify level-aware batches, scoring and commerce schema
        run: node scripts/test-academic-rollout-db.mjs

      - name: Verify Release A capacity seed
        run: node scripts/test-capacity-seed-db.mjs

      - name: Verify Release A dashboard aggregation
        run: node scripts/test-teacher-dashboard-aggregates-db.mjs

      - name: Verify Release A cursor pagination
        run: node scripts/test-cursor-pagination-db.mjs

      - name: Verify Release A fair practice sampling
        run: node scripts/test-fair-practice-selection-db.mjs

      - name: Verify Release A query-plan indexes
        run: node scripts/test-query-plan-indexes-db.mjs

      - name: Verify Release A atomic persistence
        run: node scripts/test-atomic-quiz-persistence-db.mjs

      - name: Verify Release A AI cost workflows
        run: node scripts/test-ai-quiz-cost-workflows-db.mjs

      - name: Verify Release A integrity report
        run: node scripts/test-a7-integrity-report-db.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-non-secret-${{ github.run_id }}-${{ github.run_attempt }}
      SUPABASE_SERVICE_ROLE_KEY: ci-non-secret-${{ github.run_id }}-${{ github.run_attempt }}
      SUPABASE_JWT_SECRET: ci-non-secret-${{ github.run_id }}-${{ github.run_attempt }}
      FRONTEND_ORIGIN: https://app.example.com
      GEMINI_API_KEY: ci-non-secret-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check backend dependency consistency
        run: python -m pip check

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend audit, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint frontend
        run: pnpm lint

      - name: Run frontend unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public browser smoke tests
        run: pnpm test:e2e
